<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="titaniumPrism" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EDF4FC" />
      <stop offset="35%" stop-color="#B5D7F5" />
      <stop offset="70%" stop-color="#6D9BCB" />
      <stop offset="100%" stop-color="#1B2A3D" />
    </linearGradient>
    <linearGradient id="titaniumGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6D9BCB" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#B5D7F5" stop-opacity="0.3" />
    </linearGradient>
    <radialGradient id="electricCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#B5D7F5" />
      <stop offset="50%" stop-color="#6D9BCB" />
      <stop offset="100%" stop-color="#131F30" stop-opacity="0" />
    </radialGradient>
    <filter id="titaniumShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#6D9BCB" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Dark obsidian backing rounded container -->
  <rect width="120" height="120" rx="30" fill="#0C1421" stroke="#293B51" stroke-width="2"/>
  
  <!-- Subtle inner radial glow -->
  <circle cx="60" cy="60" r="40" fill="url(#electricCore)" opacity="0.25" />

  <!-- 3D Isometric Interlocking Facets representing Min-Heap Tree & 'N' Monogram -->
  <g filter="url(#titaniumShadow)">
    <!-- Left Pillar -->
    <path d="M34 32 L46 25 L46 88 L34 95 Z" fill="url(#titaniumPrism)" />
    <!-- Diagonal Dynamic DSA Beam -->
    <path d="M46 25 L86 88 L74 95 L34 32 Z" fill="url(#titaniumGlow)" opacity="0.9" />
    <!-- Right Pillar -->
    <path d="M74 32 L86 25 L86 88 L74 95 Z" fill="url(#titaniumPrism)" />
    <!-- Top Root Node Core (Heap Minima) -->
    <circle cx="60" cy="48" r="6" fill="#EDF4FC" stroke="#B5D7F5" stroke-width="2" />
    <circle cx="60" cy="48" r="3" fill="#6D9BCB" />
  </g>
</svg>
